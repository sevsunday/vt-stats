<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VT Stats - Match Replay (Ace Combat-style)</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/replay-style.css?v=hud-layout-18">

<script type="importmap">
{
  "imports": {
    "three":         "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>

<body class="replay-mode">
<script>
(function () {
  try {
    if (window.matchMedia('(max-width: 768px)').matches
      || (window.matchMedia('(max-height: 520px)').matches
          && window.matchMedia('(pointer: coarse)').matches)) {
      document.body.classList.add('replay-compact');
    }
    if (window.parent !== window) document.body.classList.add('replay-embedded');
  } catch (err) { /* ignore */ }
})();
</script>

<!--
  Match picker landing. Hidden by default; shown when no `?match=` URL
  param is present. Boot routine in replay.js flips between this and the
  renderer mode. Card click navigates to `replay.html?match=<id>`.
-->
<div id="directory" class="directory hidden"></div>

<!--
  Renderer surface. Phase 1 doesn't ship a directory landing page yet (the
  match-picker UI lands in Phase 4) so we always boot straight into the
  default match unless ?match= overrides.
-->
<canvas id="scene"></canvas>

<!--
  DOM-overlay layer for actor labels. We project each actor's world position
  to screen coords every frame and update absolute-positioned divs inside
  this container; cheaper than vendoring CSS2DRenderer for 10 labels.
-->
<div id="replay-labels" class="replay-labels" aria-hidden="true"></div>

<!-- Structure hover/tap info chip (building name + owning team). -->
<div id="struct-tip" class="struct-tip" hidden></div>

<!--
  Letterbox bars (Phase 3 wires the toggle, but the DOM is here so the
  L hotkey works against `body.replay-letterboxed` from Phase 2).
-->
<div class="replay-letterbox-bar replay-letterbox-bar--top"></div>
<div class="replay-letterbox-bar replay-letterbox-bar--bottom"></div>

<!--
  Cinematic atmosphere layers. Pure CSS: vignette = radial-gradient,
  film grain = inline SVG noise as a tiled background. Both pointer-events
  none so they never block input. Phase 3.
-->
<div class="replay-vignette" aria-hidden="true"></div>
<div class="replay-grain"    aria-hidden="true"></div>

<!--
  Chase-cam speed lines. Pure CSS streak texture; visibility gated by
  `.replay-chase-active` body class. Phase 4.
-->
<div class="replay-speedlines" aria-hidden="true"></div>

<!--
  Compact / expanded top cluster: truncated match title + Roster/Expand.
  Hidden on desktop-in-tab (dashboard banner already names the match).
  Shown in compact always, and as a title-only chip in desktop expand.
-->
<header id="replay-chrome" class="replay-chrome">
  <div class="replay-title-chip" id="match-name">loading...</div>
  <div class="replay-chrome-actions">
    <button type="button" id="btn-roster" class="replay-icon-btn" title="Roster" aria-expanded="false" aria-controls="roster-panel">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/></svg>
      <span class="replay-icon-label">Roster</span>
    </button>
    <button type="button" id="btn-expand-top" class="replay-icon-btn replay-expand-btn" title="Fullscreen" aria-pressed="false">
      <svg class="icon-enter" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5M.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5m15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5"/></svg>
      <svg class="icon-exit" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M5.5 0a.5.5 0 0 1 .5.5v4A1.5 1.5 0 0 1 4.5 6h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5m5 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 10 4.5v-4a.5.5 0 0 1 .5-.5M0 10.5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 6 11.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5m10 1a1.5 1.5 0 0 1 1.5-1.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0z"/></svg>
    </button>
  </div>
</header>

<div id="roster-backdrop" class="roster-backdrop" hidden></div>

<!--
  Right-edge collapsible roster panel. Phase 2 layers chase-cam wiring on
  top of the focus affordance + adds keyboard cycling. Compact restyles this
  as a bottom sheet.
-->
<aside id="roster-panel" class="roster-panel">
  <header class="roster-head">
    <span class="roster-handle" aria-hidden="true"></span>
    <span class="roster-title">Roster</span>
    <span class="roster-bulk">
      <button id="roster-all-on" title="ALL ON">on</button>
      <button id="roster-all-off" title="ALL OFF">off</button>
      <button id="roster-trails" class="is-on" title="Toggle contrails" aria-pressed="true">trails</button>
      <button id="roster-engagements" class="is-on" title="Toggle attack lines" aria-pressed="true">attacks</button>
    </span>
    <button id="roster-collapse" class="roster-collapse" title="Collapse" aria-expanded="true">&minus;</button>
  </header>
  <div class="roster-body" id="roster-list"></div>
</aside>

<div id="scrap-meters" class="scrap-meters" hidden>
  <div class="scrap-meter" data-side="1">
    <div class="scrap-meter-stack">
      <div class="scrap-meter-team">T1</div>
      <div class="scrap-meter-track">
        <div class="scrap-meter-bands" aria-hidden="true"></div>
        <div class="scrap-meter-ticks" aria-hidden="true"></div>
        <div class="scrap-meter-fill" aria-hidden="true"></div>
      </div>
      <div class="scrap-meter-num">0</div>
    </div>
    <div class="scrap-meter-cmdr" hidden></div>
  </div>
  <div class="scrap-meter" data-side="2">
    <div class="scrap-meter-cmdr" hidden></div>
    <div class="scrap-meter-stack">
      <div class="scrap-meter-team">T2</div>
      <div class="scrap-meter-track">
        <div class="scrap-meter-bands" aria-hidden="true"></div>
        <div class="scrap-meter-ticks" aria-hidden="true"></div>
        <div class="scrap-meter-fill" aria-hidden="true"></div>
      </div>
      <div class="scrap-meter-num">0</div>
    </div>
  </div>
</div>

<div id="now-building" class="now-building" hidden></div>
<div id="beat-toast" class="beat-toast" hidden></div>

<div id="elo-strip" class="elo-strip" hidden></div>

<div id="event-feed" class="event-feed">
  <div id="feed-chips" class="feed-chips"></div>
  <div id="kill-ticker" class="kill-ticker"></div>
</div>

<!--
  Bottom transport bar. Compact: full-width scrub row above a single
  controls row. Desktop flattens via display:contents (scrub sits after
  time). Expand lives here on desktop so it never covers roster.
-->
<footer id="transport" class="transport">
  <span class="t-row t-row-controls">
    <button id="btn-restart" class="t-btn t-btn-icon" title="Restart (Home)">&#9198;</button>
    <button id="btn-step-back" class="t-btn t-btn-icon" title="Step back 5s (Left)">&#10094;&#10094;</button>
    <button id="btn-play" class="t-btn t-btn-play" title="Play (Space)">&#9654;</button>
    <button id="btn-step-fwd" class="t-btn t-btn-icon" title="Step forward 5s (Right)">&#10095;&#10095;</button>

    <span class="t-time"><span id="t-cur">0:00</span> / <span id="t-tot">0:00</span></span>

    <select id="speed" class="t-speed" title="Playback speed">
      <option value="1">1x</option>
    </select>

    <span class="t-cam-pills">
      <button class="cam-pill" data-cam="free"    title="Free orbit (1)">Free</button>
      <button class="cam-pill" data-cam="chase"   title="Chase cam (2)">Chase</button>
      <button class="cam-pill" data-cam="topdown" title="Top-down (3)">Top</button>
    </span>
    <button type="button" id="btn-expand" class="t-btn t-btn-icon t-expand" title="Fullscreen" aria-pressed="false">
      <svg class="icon-enter" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5M.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5m15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5"/></svg>
      <svg class="icon-exit" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M5.5 0a.5.5 0 0 1 .5.5v4A1.5 1.5 0 0 1 4.5 6h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5m5 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 10 4.5v-4a.5.5 0 0 1 .5-.5M0 10.5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 6 11.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5m10 1a1.5 1.5 0 0 1 1.5-1.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0z"/></svg>
    </button>
  </span>

  <span class="t-row t-row-scrub">
    <span class="scrub-wrap">
      <input type="range" id="scrub" class="scrub" min="0" max="1000" value="0" step="1">
      <span class="scrub-markers" id="scrub-markers" aria-hidden="true"></span>
    </span>
  </span>
</footer>

<div id="status">loading match data...</div>

<script type="module" src="js/replay.js"></script>
</body>
</html>
