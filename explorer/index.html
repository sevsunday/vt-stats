<body class="d-flex flex-column h-100">

  <nav class="navbar navbar-expand-md sticky-top border-bottom">

        <i class="bi bi-crosshair me-1"></i>VT Stats

      <button class="vt-nav-icon-btn vt-navbar-toggler d-md-none ms-auto" type="button"

            <i class="bi bi-map me-1"></i>Maps
          </a>
          <div class="dropdown vt-nav-dropdown">
            <button class="vt-nav-icon-btn" type="button" data-bs-toggle="dropdown"
                    data-bs-auto-close="true" aria-label="Ratings and players">

          </div>

    <canvas id="xp-canvas"></canvas>
    <p id="xp-status" class="vt-xp-status">Loading map…</p>

  <script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
